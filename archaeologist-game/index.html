<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Археолог: Энциклопедия динозавров</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Экран авторизации -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <h1>🦕 Археолог: Энциклопедия динозавров</h1>
            <div class="auth-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <button id="login-btn">Войти</button>
                <button id="register-btn">Регистрация</button>
                <p class="demo-note">Демо-режим: играйте без регистрации!</p>
                <button id="demo-btn">Играть демо</button>
            </div>
        </div>
    </div>

    <!-- Главное меню -->
    <div id="menu-screen" class="screen">
        <div class="menu-container">
            <h1>🦕 Археолог</h1>
            <div class="player-info">
                <span id="player-name">Игрок</span>
                <span id="player-level">Уровень: 1</span>
            </div>
            <nav class="main-menu">
                <button id="play-btn">🎮 Играть</button>
                <button id="encyclopedia-btn">📖 Энциклопедия</button>
                <button id="profile-btn">👤 Профиль</button>
                <button id="settings-btn">⚙️ Настройки</button>
                <button id="logout-btn">🚪 Выход</button>
            </nav>
        </div>
    </div>

    <!-- Экран выбора уровня -->
    <div id="level-select-screen" class="screen">
        <div class="level-container">
            <h2>Выберите уровень</h2>
            <div id="levels-grid" class="levels-grid"></div>
            <button id="back-to-menu-1">← Назад</button>
        </div>
    </div>

    <!-- Мини-игра "Путь к раскопкам" -->
    <div id="path-game-screen" class="screen">
        <div class="game-header">
            <span id="path-lives">❤️❤️❤️</span>
            <span id="path-score">Очки: 0</span>
        </div>
        <canvas id="path-canvas"></canvas>
        <div class="mobile-controls">
            <button id="left-btn">◀</button>
            <button id="right-btn">▶</button>
            <button id="jump-btn">▲</button>
        </div>
        <div id="path-message" class="game-message"></div>
    </div>

    <!-- Мини-игра "Раскопки" (Три в ряд) -->
    <div id="dig-game-screen" class="screen">
        <div class="game-header">
            <span id="dig-score">Очки: 0</span>
            <span id="dig-target">Цель: 500</span>
            <span id="dig-moves">Ходы: 20</span>
        </div>
        <canvas id="dig-canvas"></canvas>
        <div id="dig-message" class="game-message"></div>
    </div>

    <!-- Анимация находки -->
    <div id="discovery-screen" class="screen">
        <div class="discovery-container">
            <h2>🎉 Отличная работа!</h2>
            <div id="dinosaur-found" class="dinosaur-display"></div>
            <p id="dinosaur-name"></p>
            <button id="continue-btn">Продолжить</button>
        </div>
    </div>

    <!-- Энциклопедия -->
    <div id="encyclopedia-screen" class="screen">
        <div class="encyclopedia-container">
            <h2>📖 Энциклопедия динозавров</h2>
            <div id="collection-progress">Найдено: 0/25</div>
            <div id="dinosaurs-grid" class="dinosaurs-grid"></div>
            <button id="back-to-menu-2">← Назад</button>
        </div>
    </div>

    <!-- Детали динозавра -->
    <div id="dinosaur-detail-screen" class="screen">
        <div class="detail-container">
            <button id="close-detail" class="close-btn">✕</button>
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- Профиль -->
    <div id="profile-screen" class="screen">
        <div class="profile-container">
            <h2>👤 Профиль игрока</h2>
            <div id="profile-stats"></div>
            <button id="back-to-menu-3">← Назад</button>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings-screen" class="screen">
        <div class="settings-container">
            <h2>⚙️ Настройки</h2>
            <label>
                <input type="checkbox" id="sound-toggle" checked> Звук
            </label>
            <label>
                <input type="checkbox" id="music-toggle" checked> Музыка
            </label>
            <label>
                <input type="checkbox" id="hints-toggle" checked> Подсказки
            </label>
            <button id="back-to-menu-4">← Назад</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/path-game.js"></script>
    <script src="js/dig-game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
