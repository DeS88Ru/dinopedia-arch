<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Археолог: Эпоха Динозавров</title>
    <style>
        :root {
            --primary: #FF9F1C;
            --secondary: #2EC4B6;
            --dark: #011627;
            --light: #FDFFFC;
            --accent: #E71D36;
            --jungle: #2d6a4f;
            --sand: #e9c46a;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background: linear-gradient(135deg, #1b4332 0%, #081c15 100%);
            color: var(--light);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- UI Components --- */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
            opacity: 1;
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        h1, h2 {
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 1rem;
        }

        h1 { font-size: 3rem; color: var(--primary); letter-spacing: 2px; }
        
        .btn {
            background: linear-gradient(45deg, var(--primary), #ffbf69);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 6px 0 #c77d0e, 0 15px 20px rgba(0,0,0,0.4);
            transition: all 0.2s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #c77d0e, inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: linear-gradient(45deg, var(--secondary), #80ed99);
            box-shadow: 0 6px 0 #1a938a, 0 15px 20px rgba(0,0,0,0.4);
        }
        .btn-secondary:active { box-shadow: 0 0 0 #1a938a; }

        .input-group {
            margin: 15px 0;
            width: 100%;
            max-width: 300px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--secondary);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        input:focus {
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 15px var(--secondary);
            transform: scale(1.02);
        }

        /* --- Character Animation --- */
        .character-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 20px auto;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }

        .archaeologist {
            font-size: 100px;
            line-height: 1;
            display: inline-block;
            animation: breathe 3s infinite ease-in-out;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .archaeologist:hover { transform: scale(1.1) rotate(5deg); }
        .archaeologist.jump { animation: jumpAnim 0.6s ease; }
        .archaeologist.win { animation: spinWin 1s ease; }

        .speech-bubble {
            position: absolute;
            top: -40px;
            right: -20px;
            background: white;
            color: var(--dark);
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(10px);
            transition: 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 20px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: white transparent;
        }
        .speech-bubble.show { opacity: 1; transform: translateY(0); }

        /* --- Match 3 Game Board --- */
        .game-hud {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        .hud-item { display: flex; flex-direction: column; }
        .hud-label { font-size: 0.8rem; color: #aaa; }
        .hud-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

        #matchBoard {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            /* Размеры задаются через JS */
        }

        .tile {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            z-index: 10;
            /* Анимация падения */
            animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .tile:hover { filter: brightness(1.2); transform: scale(1.1); z-index: 20; }
        .tile.selected { 
            filter: brightness(1.3); 
            transform: scale(1.15); 
            z-index: 20;
            animation: pulse 1s infinite;
            box-shadow: 0 0 15px white;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }
        .tile.matched {
            animation: popMatch 0.4s forwards;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: particleFly 0.8s forwards;
            font-size: 20px;
            z-index: 30;
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.02); } }
        @keyframes jumpAnim { 0% { transform: translateY(0); } 50% { transform: translateY(-40px) rotate(10deg); } 100% { transform: translateY(0); } }
        @keyframes spinWin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg) scale(1.2); } }
        @keyframes dropIn { from { transform: translateY(-100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1.1); } 50% { transform: scale(1.2); } 100% { transform: scale(1.1); } }
        @keyframes popMatch { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
        @keyframes particleFly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .tile { width: 40px; height: 40px; font-size: 24px; }
            .character-container { width: 100px; height: 100px; }
            .archaeologist { font-size: 70px; }
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="screen active">
        <div class="character-container">
            <div class="speech-bubble" id="authBubble">Привет! Я Алекс.</div>
            <div class="archaeologist" onclick="characterInteract()">👨‍🔬</div>
        </div>
        <h1>АРХЕОЛОГ</h1>
        <p>Энциклопедия Динозавров</p>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Имя исследователя" maxlength="12">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Пароль (мин. 6 символов)" maxlength="20">
        </div>
        
        <button class="btn" onclick="handleAuth()">Начать экспедицию</button>
        <p id="authError" style="color: var(--accent); font-size: 0.9rem; height: 20px;"></p>
    </div>

    <!-- MAIN MENU -->
    <div id="menuScreen" class="screen">
        <div class="character-container">
            <div class="speech-bubble show" id="menuBubble">Выбери приключение!</div>
            <div class="archaeologist" id="menuChar">👨‍🔬</div>
        </div>
        <h2 id="welcomeText">Добро пожаловать!</h2>
        <div style="display: flex; flex-direction: column;">
            <button class="btn" onclick="startMatch3Setup()">💎 Три в ряд</button>
            <button class="btn btn-secondary" onclick="alert('Платформер в разработке!')">🦕 Платформер</button>
            <button class="btn" style="background: linear-gradient(45deg, #6c757d, #adb5bd); box-shadow: 0 6px 0 #5a6268;" onclick="logout()">Выйти</button>
        </div>
    </div>

    <!-- MATCH 3 GAME SCREEN -->
    <div id="matchScreen" class="screen">
        <div style="position: absolute; top: 20px; left: 20px;">
            <button class="btn" style="padding: 10px 20px; font-size: 0.9rem;" onclick="exitMatch()">← Меню</button>
        </div>
        
        <div class="game-hud">
            <div class="hud-item"><span class="hud-label">Очки</span><span class="hud-value" id="matchScore">0</span></div>
            <div class="hud-item"><span class="hud-label">Цель</span><span class="hud-value" id="matchTarget">1000</span></div>
            <div class="hud-item"><span class="hud-label">Ходы</span><span class="hud-value" id="matchMoves">20</span></div>
        </div>

        <div class="progress-bar" style="width: 100%; max-width: 400px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; margin-bottom: 10px; overflow: hidden;">
            <div id="matchProgress" style="height: 100%; width: 0%; background: var(--secondary); transition: width 0.5s;"></div>
        </div>

        <div id="matchBoard"></div>
        <p style="margin-top: 15px; font-size: 0.9rem; opacity: 0.8;">Меняй соседние элементы (↔️ ↕️)</p>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        const state = {
            user: null,
            game: {
                board: [],
                rows: 8,
                cols: 8,
                tileSize: 50,
                score: 0,
                target: 1000,
                moves: 20,
                selected: null,
                isProcessing: false,
                tiles: [] // Store DOM elements
            }
        };

        const gems = ['💎', '🔥', '🌿', '🥥', '🟣', '🟡']; // Разные элементы
        const levelConfigs = [
            { rows: 7, cols: 7, target: 800, moves: 15, types: 4 },
            { rows: 8, cols: 8, target: 1500, moves: 20, types: 5 },
            { rows: 9, cols: 9, target: 2500, moves: 25, types: 6 }
        ];

        // --- AUDIO SYSTEM (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'swap') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(200, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'match') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                
                // Second harmony
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(700, now);
                osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                gain2.gain.setValueAtTime(0.1, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc2.start(now);
                osc2.stop(now + 0.3);
            } else if (type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        // --- CHARACTER LOGIC ---
        function characterInteract() {
            const char = document.querySelector('.archaeologist');
            const bubble = document.getElementById('authBubble');
            
            char.classList.add('jump');
            setTimeout(() => char.classList.remove('jump'), 600);
            
            const phrases = ["Вперёд!", "Найдём динозавров!", "Удачи!", "Копай глубже!"];
            bubble.textContent = phrases[Math.floor(Math.random() * phrases.length)];
            bubble.classList.add('show');
            setTimeout(() => bubble.classList.remove('show'), 2000);
        }

        // --- AUTH MODULE ---
        function handleAuth() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('authError');

            if (!userIn || !passIn) {
                errorEl.textContent = "Заполните все поля!";
                shakeInput();
                return;
            }
            if (passIn.length < 6) {
                errorEl.textContent = "Пароль слишком короткий!";
                shakeInput();
                return;
            }

            // Simulate login
            state.user = {
                name: userIn,
                lastLogin: new Date(),
                stats: { games: 0, wins: 0 }
            };

            document.getElementById('welcomeText').textContent = `Привет, ${state.user.name}!`;
            switchScreen('menuScreen');
            
            const menuChar = document.getElementById('menuChar');
            menuChar.classList.add('win');
            setTimeout(() => menuChar.classList.remove('win'), 1000);
        }

        function shakeInput() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(inp => {
                inp.style.transform = 'translateX(10px)';
                setTimeout(() => inp.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => inp.style.transform = 'translateX(0)', 200);
            });
        }

        function logout() {
            state.user = null;
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            switchScreen('authScreen');
        }

        // --- NAVIGATION ---
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                document.getElementById(id).classList.add('active');
            }, 100); // Small delay for smooth transition
        }

        // --- MATCH 3 ENGINE ---
        function startMatch3Setup() {
            // Choose random difficulty or sequential
            const config = levelConfigs[Math.floor(Math.random() * levelConfigs.length)];
            
            state.game.rows = config.rows;
            state.game.cols = config.cols;
            state.game.target = config.target;
            state.game.moves = config.moves;
            state.game.score = 0;
            state.game.types = config.types;
            
            // Update HUD
            document.getElementById('matchTarget').textContent = state.game.target;
            document.getElementById('matchMoves').textContent = state.game.moves;
            updateScore(0);
            
            initBoard();
            switchScreen('matchScreen');
        }

        function initBoard() {
            const boardEl = document.getElementById('matchBoard');
            boardEl.innerHTML = '';
            state.game.board = [];
            state.game.tiles = [];
            state.game.isProcessing = false;
            state.game.selected = null;

            // Calculate tile size based on screen
            const maxWidth = Math.min(window.innerWidth - 40, 500);
            const maxHeight = window.innerHeight - 200;
            const sizeByCols = Math.floor(maxWidth / state.game.cols);
            const sizeByRows = Math.floor(maxHeight / state.game.rows);
            state.game.tileSize = Math.min(sizeByCols, sizeByRows, 60); // Max 60px

            boardEl.style.width = `${state.game.cols * state.game.tileSize}px`;
            boardEl.style.height = `${state.game.rows * state.game.tileSize}px`;

            // Generate Grid
            for (let r = 0; r < state.game.rows; r++) {
                state.game.board[r] = [];
                state.game.tiles[r] = [];
                for (let c = 0; c < state.game.cols; c++) {
                    let type;
                    // Prevent initial matches
                    do {
                        type = Math.floor(Math.random() * state.game.types);
                    } while (
                        (c >= 2 && state.game.board[r][c-1] === type && state.game.board[r][c-2] === type) ||
                        (r >= 2 && state.game.board[r-1][c] === type && state.game.board[r-2][c] === type)
                    );
                    
                    state.game.board[r][c] = type;
                    createTile(r, c, type);
                }
            }
        }

        function createTile(r, c, type, isDrop = false) {
            const boardEl = document.getElementById('matchBoard');
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.textContent = gems[type];
            tile.dataset.r = r;
            tile.dataset.c = c;
            tile.dataset.type = type;
            
            setPosition(tile, r, c);
            
            if (isDrop) {
                tile.style.top = `-${state.game.tileSize * 2}px`; // Start above
                setTimeout(() => setPosition(tile, r, c), 50);
            }

            tile.onclick = () => handleTileClick(r, c);
            
            boardEl.appendChild(tile);
            state.game.tiles[r][c] = tile;
        }

        function setPosition(element, r, c) {
            element.style.width = `${state.game.tileSize}px`;
            element.style.height = `${state.game.tileSize}px`;
            element.style.fontSize = `${state.game.tileSize * 0.6}px`;
            element.style.left = `${c * state.game.tileSize}px`;
            element.style.top = `${r * state.game.tileSize}px`;
        }

        function handleTileClick(r, c) {
            if (state.game.isProcessing) return;
            if (state.game.moves <= 0) return;

            const clickedTile = state.game.tiles[r][c];

            if (!state.game.selected) {
                // Select first
                state.game.selected = { r, c };
                clickedTile.classList.add('selected');
                playSound('select');
            } else {
                const prev = state.game.selected;
                clickedTile.classList.remove('selected');
                state.game.selected = null;

                // Check adjacency
                const dr = Math.abs(prev.r - r);
                const dc = Math.abs(prev.c - c);
                
                if (dr + dc === 1) {
                    // Valid neighbor, try swap
                    swapTiles(prev.r, prev.c, r, c);
                } else if (prev.r === r && prev.c === c) {
                    // Clicked same tile, just deselect (already done)
                } else {
                    // Clicked far away, select new
                    state.game.selected = { r, c };
                    clickedTile.classList.add('selected');
                    playSound('select');
                }
            }
        }

        async function swapTiles(r1, c1, r2, c2) {
            state.game.isProcessing = true;
            playSound('swap');

            // Visual Swap
            const t1 = state.game.tiles[r1][c1];
            const t2 = state.game.tiles[r2][c2];

            // Swap in data
            let tempType = state.game.board[r1][c1];
            state.game.board[r1][c1] = state.game.board[r2][c2];
            state.game.board[r2][c2] = tempType;

            // Swap in DOM array
            state.game.tiles[r1][c1] = t2;
            state.game.tiles[r2][c2] = t1;
            
            // Update dataset
            t1.dataset.r = r2; t1.dataset.c = c2;
            t2.dataset.r = r1; t2.dataset.c = c1;

            // Animate
            setPosition(t1, r2, c2);
            setPosition(t2, r1, c1);

            await wait(300);

            // Check matches
            const matches = findMatches();
            
            if (matches.length > 0) {
                state.game.moves--;
                document.getElementById('matchMoves').textContent = state.game.moves;
                await processMatches(matches);
            } else {
                // Invalid move, swap back
                playSound('select'); // Error sound
                tempType = state.game.board[r1][c1];
                state.game.board[r1][c1] = state.game.board[r2][c2];
                state.game.board[r2][c2] = tempType;

                state.game.tiles[r1][c1] = t2;
                state.game.tiles[r2][c2] = t1;
                
                t1.dataset.r = r1; t1.dataset.c = c1;
                t2.dataset.r = r2; t2.dataset.c = c2;

                setPosition(t1, r1, c1);
                setPosition(t2, r2, c2);
                await wait(300);
                state.game.isProcessing = false;
            }
        }

        function findMatches() {
            let matchedSet = new Set();

            // Horizontal
            for (let r = 0; r < state.game.rows; r++) {
                for (let c = 0; c < state.game.cols - 2; c++) {
                    let type = state.game.board[r][c];
                    if (type === -1) continue;
                    let matchLen = 1;
                    while (c + matchLen < state.game.cols && state.game.board[r][c + matchLen] === type) {
                        matchLen++;
                    }
                    if (matchLen >= 3) {
                        for (let i = 0; i < matchLen; i++) matchedSet.add(`${r},${c + i}`);
                        c += matchLen - 1;
                    }
                }
            }

            // Vertical
            for (let c = 0; c < state.game.cols; c++) {
                for (let r = 0; r < state.game.rows - 2; r++) {
                    let type = state.game.board[r][c];
                    if (type === -1) continue;
                    let matchLen = 1;
                    while (r + matchLen < state.game.rows && state.game.board[r + matchLen][c] === type) {
                        matchLen++;
                    }
                    if (matchLen >= 3) {
                        for (let i = 0; i < matchLen; i++) matchedSet.add(`${r + i},${c}`);
                        r += matchLen - 1;
                    }
                }
            }

            return Array.from(matchedSet).map(str => {
                const [r, c] = str.split(',').map(Number);
                return { r, c };
            });
        }

        async function processMatches(matches) {
            playSound('match');
            
            // Calculate Score
            const points = matches.length * 10 + (matches.length > 3 ? (matches.length - 3) * 20 : 0);
            updateScore(state.game.score + points);

            // Animate removal
            matches.forEach(m => {
                const tile = state.game.tiles[m.r][m.c];
                if (tile) {
                    tile.classList.add('matched');
                    createParticles(m.r, m.c, tile.textContent);
                    state.game.board[m.r][m.c] = -1; // Mark empty
                }
            });

            await wait(400);

            // Remove from DOM and Data
            matches.forEach(m => {
                if (state.game.tiles[m.r][m.c]) {
                    state.game.tiles[m.r][m.c].remove();
                    state.game.tiles[m.r][m.c] = null;
                }
            });

            await dropTiles();
        }

        async function dropTiles() {
            // Gravity
            for (let c = 0; c < state.game.cols; c++) {
                let emptySlots = 0;
                for (let r = state.game.rows - 1; r >= 0; r--) {
                    if (state.game.board[r][c] === -1) {
                        emptySlots++;
                    } else if (emptySlots > 0) {
                        // Move down
                        const type = state.game.board[r][c];
                        const tile = state.game.tiles[r][c];
                        
                        state.game.board[r + emptySlots][c] = type;
                        state.game.board[r][c] = -1;
                        
                        state.game.tiles[r + emptySlots][c] = tile;
                        state.game.tiles[r][c] = null;
                        
                        tile.dataset.r = r + emptySlots;
                        setPosition(tile, r + emptySlots, c);
                    }
                }
                
                // Fill top
                for (let r = 0; r < emptySlots; r++) {
                    const type = Math.floor(Math.random() * state.game.types);
                    state.game.board[r][c] = type;
                    createTile(r, c, type, true);
                }
            }

            await wait(400);
            
            // Check cascading matches
            const newMatches = findMatches();
            if (newMatches.length > 0) {
                await processMatches(newMatches);
            } else {
                checkGameEnd();
                state.game.isProcessing = false;
            }
        }

        function createParticles(r, c, char) {
            const boardEl = document.getElementById('matchBoard');
            const x = c * state.game.tileSize + state.game.tileSize/2;
            const y = r * state.game.tileSize + state.game.tileSize/2;

            for(let i=0; i<5; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.textContent = char;
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 30;
                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                
                boardEl.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        function updateScore(newScore) {
            state.game.score = newScore;
            document.getElementById('matchScore').textContent = state.game.score;
            
            const pct = Math.min(100, (state.game.score / state.game.target) * 100);
            document.getElementById('matchProgress').style.width = pct + '%';
        }

        function checkGameEnd() {
            if (state.game.score >= state.game.target) {
                playSound('win');
                setTimeout(() => {
                    alert(`Победа! Вы набрали ${state.game.score} очков!`);
                    exitMatch();
                }, 500);
            } else if (state.game.moves <= 0) {
                setTimeout(() => {
                    alert(`Игра окончена. Не хватило ходов! Счет: ${state.game.score}`);
                    exitMatch();
                }, 500);
            }
        }

        function exitMatch() {
            switchScreen('menuScreen');
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Init
        // Check local storage for user could be added here
    </script>
</body>
</html>
